name: M6 Preview

on:
  pull_request:
    branches: [staging]

permissions:
  contents: read
  statuses: read

concurrency:
  group: m6-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.head_ref == 'feat/m6-study-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build deterministic current-head assets
        run: npm run build

      - name: Validate deterministic exact-head preview artifact
        run: node scripts/m6-preview-smoke.mjs

      - name: Verify Netlify READY status for exact PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          M6_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          M6_PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--radicx.netlify.app
        run: |
          for attempt in {1..30}; do
            echo "Exact-head Netlify status validation attempt $attempt"
            if node scripts/m6-netlify-status-smoke.mjs; then
              exit 0
            fi
            sleep 10
          done
          echo "Netlify did not report the exact-head Deploy Preview READY within the allowed window."
          exit 1
