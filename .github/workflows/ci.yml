name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Smoke-test Netlify deployment
        if: github.event_name == 'pull_request' || github.ref_name == 'staging' || github.ref_name == 'main'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            url="https://deploy-preview-${PR_NUMBER}--radicx.netlify.app/"
          elif [[ "$REF_NAME" == "staging" ]]; then
            url="https://staging--radicx.netlify.app/"
          else
            url="https://radicx.netlify.app/"
          fi

          echo "Waiting for Netlify deployment: $url"

          for attempt in {1..30}; do
            status="$(curl --connect-timeout 10 --max-time 20 -sS -o /dev/null -w '%{http_code}' "$url" || true)"
            case "$status" in
              200|204|301|302|303|307|308|401|403)
                echo "Netlify deployment responded with HTTP $status on attempt $attempt."
                exit 0
                ;;
            esac

            echo "Attempt $attempt returned HTTP ${status:-000}; retrying in 10 seconds."
            sleep 10
          done

          echo "Netlify deployment did not become reachable within the validation window."
          exit 1
