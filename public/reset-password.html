<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#FCFCFD" /><meta name="robots" content="noindex,nofollow" /><title>Reset password · RadicX</title><link rel="stylesheet" href="/assets/styles.css" /></head>
  <body class="m5-auth-shell" data-m5-page="reset">
    <a class="skip-link" href="#auth-main">Skip to password reset</a><header class="m5-auth-header"><div class="m5-auth-header__inner"><a class="radic-brand" href="/" aria-label="RadicX home"><span class="radic-brand__mark" aria-hidden="true">R</span><span>RadicX</span></a></div></header>
    <main class="m5-auth-main" id="auth-main"><section class="m5-auth-intro" aria-labelledby="reset-intro"><p class="radic-eyebrow">Secure recovery session</p><h1 class="radic-page-heading" id="reset-intro">Choose a new password.</h1><p class="radic-supporting-text">The form is enabled only after Supabase confirms a valid recovery session.</p></section><section class="radic-card m5-auth-panel" aria-labelledby="reset-title"><div class="radic-card__body"><div><p class="radic-eyebrow">Password reset</p><h2 id="reset-title">Update password</h2></div><form class="m5-auth-form" id="reset-form"><div class="radic-field m5-password-row"><label class="radic-label" for="reset-password">New password</label><input class="radic-input" id="reset-password" name="password" type="password" autocomplete="new-password" minlength="8" required /><button class="m5-password-toggle" type="button" data-password-toggle="reset-password" aria-pressed="false">Show</button></div><div class="radic-field m5-password-row"><label class="radic-label" for="reset-password-confirm">Confirm new password</label><input class="radic-input" id="reset-password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required /><button class="m5-password-toggle" type="button" data-password-toggle="reset-password-confirm" aria-pressed="false">Show</button></div><div class="m5-auth-form__actions"><button class="radic-button radic-button--primary" type="submit">Update password</button></div></form><p class="m5-form-message" id="reset-message" role="status" aria-live="polite" data-auth-config-message></p></div></section></main><script src="/assets/runtime-config.js"></script><script type="module" src="/assets/m5/auth-pages.js"></script>
