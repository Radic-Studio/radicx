<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FCFCFD" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Sign in · RadicX</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body class="m5-auth-shell" data-m5-page="login">
    <a class="skip-link" href="#auth-main">Skip to sign in</a>
    <header class="m5-auth-header">
      <div class="m5-auth-header__inner">
        <a class="radic-brand" href="/" aria-label="RadicX home"><span class="radic-brand__mark" aria-hidden="true">R</span><span>RadicX</span></a>
        <a class="radic-button radic-button--text" href="/signup.html">Create account</a>
      </div>
    </header>
    <main class="m5-auth-main" id="auth-main">
      <section class="m5-auth-intro" aria-labelledby="login-intro-title">
        <p class="radic-eyebrow">Student access</p>
        <h1 class="radic-page-heading" id="login-intro-title">Return to your preparation space.</h1>
        <p class="radic-supporting-text">Your authenticated state and onboarding progress are restored from Supabase. Learning scores are not invented before their engines exist.</p>
      </section>
      <section class="radic-card m5-auth-panel" aria-labelledby="login-title">
        <div class="radic-card__body">
          <div><p class="radic-eyebrow">Welcome back</p><h2 id="login-title">Sign in</h2></div>
          <form class="m5-auth-form" id="login-form">
            <div class="radic-field"><label class="radic-label" for="login-email">Email address</label><input class="radic-input" id="login-email" name="email" type="email" autocomplete="email" required /></div>
            <div class="radic-field m5-password-row"><label class="radic-label" for="login-password">Password</label><input class="radic-input" id="login-password" name="password" type="password" autocomplete="current-password" required /><button class="m5-password-toggle" type="button" data-password-toggle="login-password" aria-pressed="false">Show</button></div>
            <p class="m5-form-message" id="login-message" role="status" aria-live="polite" data-auth-config-message></p>
            <div class="m5-auth-form__actions"><button class="radic-button radic-button--primary" type="submit">Sign in</button></div>
          </form>
          <div class="m5-auth-links"><a href="/forgot-password.html">Forgot password?</a><a href="/verify-email.html">Resend verification</a></div>
        </div>
      </section>
    </main>
    <script src="/assets/runtime-config.js"></script>
    <script type="module" src="/assets/m5/auth-pages.js"></script>
  </body>
</html>
