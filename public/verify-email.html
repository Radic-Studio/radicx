<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#FCFCFD" /><meta name="robots" content="noindex,nofollow" /><title>Verify email · RadicX</title><link rel="stylesheet" href="/assets/styles.css" /></head>
  <body class="m5-auth-shell" data-m5-page="verify">
    <a class="skip-link" href="#auth-main">Skip to email verification</a>
    <header class="m5-auth-header"><div class="m5-auth-header__inner"><a class="radic-brand" href="/" aria-label="RadicX home"><span class="radic-brand__mark" aria-hidden="true">R</span><span>RadicX</span></a><a class="radic-button radic-button--text" href="/login.html">Sign in</a></div></header>
    <main class="m5-auth-main" id="auth-main">
      <section class="m5-auth-intro" aria-labelledby="verify-intro"><p class="radic-eyebrow">Account verification</p><h1 class="radic-page-heading" id="verify-intro">Check your email before signing in.</h1><p class="radic-supporting-text">Use the secure link sent by RadicX. Verification links can expire, because apparently even hyperlinks require a lifecycle policy.</p></section>
      <section class="radic-card m5-auth-panel" aria-labelledby="verify-title"><div class="radic-card__body"><div><p class="radic-eyebrow">Need another link?</p><h2 id="verify-title">Resend verification</h2></div><form class="m5-auth-form" id="verify-form"><div class="radic-field"><label class="radic-label" for="verify-email">Email address</label><input class="radic-input" id="verify-email" name="email" type="email" autocomplete="email" required /></div><p class="m5-form-message" id="verify-message" role="status" aria-live="polite" data-auth-config-message></p><div class="m5-auth-form__actions"><button class="radic-button radic-button--primary" type="submit">Resend verification email</button></div></form><div class="m5-auth-links"><a href="/login.html">Back to sign in</a></div></div></section>
    </main><script src="/assets/runtime-config.js"></script><script type="module" src="/assets/m5/auth-pages.js"></script>
  </body>
</html>
