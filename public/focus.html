<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Focus Shell — RadicX M3</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#focus-main">Skip to question area</a>
    <div class="focus-shell">
      <header class="focus-header">
        <div class="focus-header__inner">
          <a class="radic-button radic-button--ghost" href="/student.html">← Leave focus mode</a>
          <span class="radic-sync-state radic-sync-state--success" role="status"><span class="radic-status-dot"></span>Online</span>
        </div>
      </header>

      <main class="focus-main" id="focus-main">
        <div>
          <p class="radic-eyebrow">Focus Mode shell</p>
          <p class="radic-supporting-text">Rewards, missions and general navigation are intentionally removed from the active cognition surface.</p>
        </div>

        <section class="focus-question-stage" aria-labelledby="focus-question-title">
          <div>
            <span class="radic-badge radic-badge--neutral">Question position reserved</span>
            <h1 class="radic-question-text" id="focus-question-title" style="margin-top: 16px;">Study question content will appear here when the Study Engine is implemented in M6.</h1>
          </div>
          <div class="radic-stack" aria-label="Answer option placeholders">
            <div class="answer-placeholder"><span class="answer-placeholder__key">A</span><span class="radic-skeleton" style="width: 72%; height: 18px;" aria-hidden="true"></span></div>
            <div class="answer-placeholder"><span class="answer-placeholder__key">B</span><span class="radic-skeleton" style="width: 84%; height: 18px;" aria-hidden="true"></span></div>
            <div class="answer-placeholder"><span class="answer-placeholder__key">C</span><span class="radic-skeleton" style="width: 64%; height: 18px;" aria-hidden="true"></span></div>
            <div class="answer-placeholder"><span class="answer-placeholder__key">D</span><span class="radic-skeleton" style="width: 78%; height: 18px;" aria-hidden="true"></span></div>
          </div>
        </section>
      </main>

      <footer class="focus-footer">
        <div class="focus-footer__inner">
          <button class="radic-button radic-button--secondary" type="button" disabled>Previous</button>
          <div class="radic-cluster">
            <button class="radic-button radic-button--ghost" type="button" disabled>Bookmark</button>
            <button class="radic-button radic-button--primary" type="button" disabled>Continue</button>
          </div>
        </div>
      </footer>
    </div>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
